<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Moderação da galeria · Rede de Nós</title>
<style>
  :root { --bg: #0e0d0d; --panel: #171515; --line: #2a2625; --text: #ece6e2; --muted: #9a8f88;
    --accent: #ff6600; --accent-2: #ffb27f; --accent-soft: #ff66001f; --ok: #7fd18b; --ruim: #ff8a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  [hidden] { display: none !important; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 17px; margin: 0; } h1 span { color: var(--accent); }
  button, input { font: inherit; color: var(--text); background: #1f1c1b; border: 1px solid var(--line); border-radius: 9px; padding: 7px 11px; }
  button { cursor: pointer; } button:hover:not(:disabled) { border-color: #4a423f; } button:disabled { opacity: .45; cursor: default; }
  button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a0d04; font-weight: 700; }
  .filtros { display: flex; flex-wrap: wrap; gap: 6px; }
  .info { color: var(--muted); font-size: 12.5px; }
  main { padding: 16px 18px 40px; }
  .login { max-width: 360px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .login h2 { margin: 0 0 12px; font-size: 18px; }
  .login input { width: 100%; margin-bottom: 10px; }
  .login button { width: 100%; }
  .msg { color: var(--muted); font-size: 13px; margin-top: 8px; } .msg.erro { color: var(--ruim); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .item.escondida { border-color: #6a2a20; }
  .item a { display: block; aspect-ratio: 16 / 10; background: #000; }
  .item img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .item .corpo { padding: 9px 10px 10px; }
  .item .linha { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted); }
  .tag.ok { color: var(--ok); border-color: #3f7d48; } .tag.ruim { color: var(--ruim); border-color: #8a3328; }
  .tag.accent { color: var(--accent-2); border-color: #6a3510; }
  .meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .acoes { display: flex; gap: 6px; margin-top: 8px; } .acoes button { flex: 1; padding: 6px 4px; font-size: 12.5px; }
  .acoes .apagar { color: var(--ruim); }
  .mais { display: block; margin: 16px auto 0; }
</style>
</head>
<body>
<header>
  <h1><span>⚡</span> Moderação da galeria</h1>
  <div class="filtros" id="filtros" hidden>
    <button data-filtro="denunciadas">Denunciadas</button>
    <button data-filtro="ocultas">Escondidas</button>
    <button data-filtro="galeria">Na galeria</button>
    <button data-filtro="recentes">Todas as artes</button>
    <button id="sair">Sair</button>
  </div>
</header>
<main>
  <form class="login" id="login" hidden>
    <h2>Entrar</h2>
    <input type="password" id="token" placeholder="ADMIN_TOKEN" autocomplete="current-password" required>
    <button class="primary" type="submit">Entrar</button>
    <div class="msg" id="msgLogin"></div>
  </form>
  <div id="painel" hidden>
    <div class="info" id="info"></div>
    <div class="msg" id="msg"></div>
    <div class="grade" id="grade"></div>
    <button class="mais" id="mais" hidden>Carregar mais</button>
  </div>
</main>
<script src="/admin/galeria.js"></script>
</body>
</html>
